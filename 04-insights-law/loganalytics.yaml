# ASO Lab - Phase 3: Log Analytics Workspace
# Depends on: Resource Group (rg-aso-workloads-shola)

apiVersion: operationalinsights.azure.com/v1api20210601
kind: Workspace
metadata:
  name: law-aso-lab-shola
  namespace: default
spec:
  location: northeurope
  owner:
    name: rg-aso-workloads-shola
  sku:
    name: PerGB2018  # Pay-as-you-go pricing
  retentionInDays: 30  # Minimum for lab (7-730 days allowed)
  publicNetworkAccessForIngestion: Enabled
  publicNetworkAccessForQuery: Enabled
  tags:
    purpose: aso-lab
    owner: shola
    managed-by: aso
