# Flux Kustomization
# Tells Flux what to deploy from the Git repository

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aso-infrastructure
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: aso-lab
  path: ./01-resource-group
  prune: true
  wait: true
  timeout: 5m0s

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aso-storage
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: aso-lab
  path: ./03-storage
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: aso-infrastructure

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aso-keyvault
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: aso-lab
  path: ./02-keyvault
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: aso-infrastructure
