---
# Complete three-tier application stack
# This demonstrates a KRO pattern for deploying a full application infrastructure

# Resource Group
apiVersion: resources.azure.com/v1api20200601
kind: ResourceGroup
metadata:
  name: three-tier-app-rg
  namespace: default
  labels:
    stack: three-tier-app
    pattern: kro-composite
spec:
  location: eastus
  tags:
    Stack: three-tier-app
    Pattern: KRO-Composite
    Environment: Development

---
# Virtual Network with three subnets (web, app, data)
apiVersion: network.azure.com/v1api20201101
kind: VirtualNetwork
metadata:
  name: three-tier-vnet
  namespace: default
  labels:
    stack: three-tier-app
spec:
  location: eastus
  owner:
    name: three-tier-app-rg
  addressSpace:
    addressPrefixes:
    - 10.100.0.0/16
  subnets:
  # Web tier subnet
  - name: web-subnet
    properties:
      addressPrefix: 10.100.1.0/24
      serviceEndpoints:
      - service: Microsoft.Storage
      - service: Microsoft.KeyVault
  
  # Application tier subnet
  - name: app-subnet
    properties:
      addressPrefix: 10.100.2.0/24
      serviceEndpoints:
      - service: Microsoft.Sql
      - service: Microsoft.Storage
  
  # Data tier subnet
  - name: data-subnet
    properties:
      addressPrefix: 10.100.3.0/24
      serviceEndpoints:
      - service: Microsoft.Sql

---
# Storage Account for application data
apiVersion: storage.azure.com/v1api20230101
kind: StorageAccount
metadata:
  name: threetierappsa
  namespace: default
  labels:
    stack: three-tier-app
spec:
  location: eastus
  owner:
    name: three-tier-app-rg
  kind: StorageV2
  sku:
    name: Standard_LRS
  accessTier: Hot
  allowBlobPublicAccess: false
  minimumTlsVersion: TLS1_2
  enableHttpsTrafficOnly: true
  tags:
    Stack: three-tier-app
    Tier: Storage
  operatorSpec:
    secrets:
      key1:
        name: three-tier-storage-keys
        key: key1
      connectionString:
        name: three-tier-storage-keys
        key: connectionString

---
# Key Vault for secrets management
apiVersion: keyvault.azure.com/v1api20210401preview
kind: Vault
metadata:
  name: three-tier-kv
  namespace: default
  labels:
    stack: three-tier-app
spec:
  location: eastus
  owner:
    name: three-tier-app-rg
  properties:
    sku:
      family: A
      name: standard
    tenantId: "<your-tenant-id>"  # Replace with your tenant ID
    enableSoftDelete: true
    softDeleteRetentionInDays: 7
    enableRbacAuthorization: true
  tags:
    Stack: three-tier-app
    Tier: Security

---
# Network Security Group for web tier
apiVersion: network.azure.com/v1api20201101
kind: NetworkSecurityGroup
metadata:
  name: web-tier-nsg
  namespace: default
  labels:
    stack: three-tier-app
    tier: web
spec:
  location: eastus
  owner:
    name: three-tier-app-rg
  securityRules:
  - name: allow-https
    properties:
      priority: 100
      direction: Inbound
      access: Allow
      protocol: Tcp
      sourceAddressPrefix: Internet
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      destinationPortRange: "443"
  - name: allow-http
    properties:
      priority: 110
      direction: Inbound
      access: Allow
      protocol: Tcp
      sourceAddressPrefix: Internet
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      destinationPortRange: "80"
  tags:
    Stack: three-tier-app
    Tier: web

---
# Network Security Group for app tier
apiVersion: network.azure.com/v1api20201101
kind: NetworkSecurityGroup
metadata:
  name: app-tier-nsg
  namespace: default
  labels:
    stack: three-tier-app
    tier: app
spec:
  location: eastus
  owner:
    name: three-tier-app-rg
  securityRules:
  - name: allow-from-web
    properties:
      priority: 100
      direction: Inbound
      access: Allow
      protocol: Tcp
      sourceAddressPrefix: 10.100.1.0/24  # Web subnet
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      destinationPortRange: "8080"
  tags:
    Stack: three-tier-app
    Tier: app

---
# Network Security Group for data tier
apiVersion: network.azure.com/v1api20201101
kind: NetworkSecurityGroup
metadata:
  name: data-tier-nsg
  namespace: default
  labels:
    stack: three-tier-app
    tier: data
spec:
  location: eastus
  owner:
    name: three-tier-app-rg
  securityRules:
  - name: allow-from-app
    properties:
      priority: 100
      direction: Inbound
      access: Allow
      protocol: Tcp
      sourceAddressPrefix: 10.100.2.0/24  # App subnet
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      destinationPortRange: "1433"
  tags:
    Stack: three-tier-app
    Tier: data
