apiVersion: network.azure.com/v1api20201101
kind: NetworkSecurityGroup
metadata:
  name: aso-lab-nsg
  namespace: default
spec:
  location: eastus
  owner:
    name: aso-lab-rg
  securityRules:
  # Allow HTTP inbound
  - name: allow-http
    properties:
      priority: 100
      direction: Inbound
      access: Allow
      protocol: Tcp
      sourceAddressPrefix: Internet
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      destinationPortRange: "80"
  
  # Allow HTTPS inbound
  - name: allow-https
    properties:
      priority: 110
      direction: Inbound
      access: Allow
      protocol: Tcp
      sourceAddressPrefix: Internet
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      destinationPortRange: "443"
  
  # Allow SSH from specific IP (replace with your IP)
  - name: allow-ssh
    properties:
      priority: 120
      direction: Inbound
      access: Allow
      protocol: Tcp
      sourceAddressPrefix: "0.0.0.0/0"  # Replace with your IP
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      destinationPortRange: "22"
  
  # Deny all other inbound
  - name: deny-all-inbound
    properties:
      priority: 4096
      direction: Inbound
      access: Deny
      protocol: "*"
      sourceAddressPrefix: "*"
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      destinationPortRange: "*"
