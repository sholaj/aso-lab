apiVersion: storage.azure.com/v1api20230101
kind: StorageAccount
metadata:
  name: asolabstoragesecret
  namespace: default
spec:
  location: eastus
  owner:
    name: aso-lab-rg
  kind: StorageV2
  sku:
    name: Standard_LRS
  accessTier: Hot
  allowBlobPublicAccess: false
  minimumTlsVersion: TLS1_2
  # Automatically export keys to Kubernetes secret
  operatorSpec:
    secrets:
      key1:
        name: storage-keys
        key: key1
      key2:
        name: storage-keys
        key: key2
      connectionString:
        name: storage-keys
        key: connectionString
