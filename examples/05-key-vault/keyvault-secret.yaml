apiVersion: keyvault.azure.com/v1api20210401preview
kind: VaultsSecret
metadata:
  name: db-connection-string
  namespace: default
spec:
  owner:
    name: aso-lab-kv
  properties:
    # Secret value - in production, get from secure source
    value: "Server=myserver.database.windows.net;Database=mydb;User=dbadmin;Password=SecureP@ssw0rd123!"
    contentType: "text/plain"
  # Export to Kubernetes secret
  operatorSpec:
    secrets:
      value:
        name: app-database-secret
        key: connectionString
