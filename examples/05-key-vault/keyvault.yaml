apiVersion: keyvault.azure.com/v1api20210401preview
kind: Vault
metadata:
  name: aso-lab-kv
  namespace: default
spec:
  location: eastus
  owner:
    name: aso-lab-rg
  properties:
    sku:
      family: A
      name: standard
    tenantId: "<your-tenant-id>"  # Replace with your Azure AD tenant ID
    enableSoftDelete: true
    softDeleteRetentionInDays: 7
    enableRbacAuthorization: true
    publicNetworkAccess: Enabled
  tags:
    Environment: Development
    ManagedBy: ASO
