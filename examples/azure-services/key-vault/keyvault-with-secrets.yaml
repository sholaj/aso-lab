# Key Vault with Secrets Managed by ASO

---
apiVersion: v1
kind: Namespace
metadata:
  name: azure-keyvault-secrets
---
apiVersion: resources.azure.com/v1api20200601
kind: ResourceGroup
metadata:
  name: kv-secrets-rg
  namespace: azure-keyvault-secrets
spec:
  location: eastus
  tags:
    purpose: keyvault-secrets-demo
---
# Key Vault
apiVersion: keyvault.azure.com/v1api20230701
kind: Vault
metadata:
  name: kvsecrets001
  namespace: azure-keyvault-secrets
spec:
  owner:
    name: kv-secrets-rg
  location: eastus
  properties:
    tenantId: "00000000-0000-0000-0000-000000000000"  # Replace with your tenant ID
    sku:
      family: A
      name: standard
    enableRbacAuthorization: true
    enableSoftDelete: true
    softDeleteRetentionInDays: 7  # Short for demo
    enablePurgeProtection: false
    publicNetworkAccess: Enabled
  tags:
    feature: secrets-management
---
# Example: Secret managed by ASO
# Note: In ASO v2, secrets are typically managed through Azure Portal or CLI
# and then referenced in Kubernetes using External Secrets Operator or CSI driver
---
# ConfigMap with examples
apiVersion: v1
kind: ConfigMap
metadata:
  name: keyvault-secrets-guide
  namespace: azure-keyvault-secrets
data:
  README.md: |
    # Key Vault Secrets Management
    
    ## Creating Secrets
    
    ### Using Azure CLI
    ```bash
    # Set RBAC permissions first
    USER_OBJECT_ID=$(az ad signed-in-user show --query id -o tsv)
    VAULT_ID=$(az keyvault show \
      --name kvsecrets001 \
      --resource-group kv-secrets-rg \
      --query id -o tsv)
    
    az role assignment create \
      --role "Key Vault Secrets Officer" \
      --assignee $USER_OBJECT_ID \
      --scope $VAULT_ID
    
    # Create secrets
    az keyvault secret set \
      --vault-name kvsecrets001 \
      --name "database-password" \
      --value "MySecurePassword123!"
    
    az keyvault secret set \
      --vault-name kvsecrets001 \
      --name "api-key" \
      --value "sk_live_1234567890abcdef"
    
    az keyvault secret set \
      --vault-name kvsecrets001 \
      --name "connection-string" \
      --value "Server=myserver;Database=mydb;User=admin;Password=pass123"
    ```
    
    ## Accessing Secrets from Kubernetes
    
    ### Method 1: External Secrets Operator (Recommended)
    
    #### Install External Secrets Operator
    ```bash
    helm repo add external-secrets https://charts.external-secrets.io
    helm repo update
    
    helm install external-secrets \
      external-secrets/external-secrets \
      -n external-secrets-system \
      --create-namespace
    ```
    
    #### Configure SecretStore
    ```yaml
    apiVersion: external-secrets.io/v1beta1
    kind: SecretStore
    metadata:
      name: azure-kv-store
      namespace: azure-keyvault-secrets
    spec:
      provider:
        azurekv:
          vaultUrl: "https://kvsecrets001.vault.azure.net"
          authType: WorkloadIdentity
          # Or use service principal:
          # authSecretRef:
          #   clientId:
          #     name: azure-secret-sp
          #     key: ClientID
          #   clientSecret:
          #     name: azure-secret-sp
          #     key: ClientSecret
          tenantId: "00000000-0000-0000-0000-000000000000"
    ```
    
    #### Create ExternalSecret
    ```yaml
    apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      name: app-secrets
      namespace: azure-keyvault-secrets
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: azure-kv-store
        kind: SecretStore
      target:
        name: app-secrets
        creationPolicy: Owner
      data:
        - secretKey: db-password
          remoteRef:
            key: database-password
        - secretKey: api-key
          remoteRef:
            key: api-key
        - secretKey: connection-string
          remoteRef:
            key: connection-string
    ```
    
    #### Use in Pod
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: azure-keyvault-secrets
    spec:
      containers:
        - name: app
          image: nginx
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-password
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: api-key
    ```
    
    ### Method 2: Secrets Store CSI Driver
    
    #### Install CSI Driver
    ```bash
    helm repo add csi-secrets-store-provider-azure https://azure.github.io/secrets-store-csi-driver-provider-azure/charts
    helm repo update
    
    helm install csi-secrets-store-provider-azure/csi-secrets-store-provider-azure \
      --generate-name \
      --namespace kube-system
    ```
    
    #### Configure SecretProviderClass
    ```yaml
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: azure-kvname
      namespace: azure-keyvault-secrets
    spec:
      provider: azure
      parameters:
        usePodIdentity: "false"
        useVMManagedIdentity: "true"
        userAssignedIdentityID: ""
        keyvaultName: "kvsecrets001"
        cloudName: ""
        objects: |
          array:
            - |
              objectName: database-password
              objectType: secret
              objectVersion: ""
            - |
              objectName: api-key
              objectType: secret
        tenantId: "00000000-0000-0000-0000-000000000000"
      secretObjects:
        - secretName: keyvault-secrets
          type: Opaque
          data:
            - objectName: database-password
              key: db-password
            - objectName: api-key
              key: api-key
    ```
    
    #### Use in Pod
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: secrets-store-inline
      namespace: azure-keyvault-secrets
    spec:
      containers:
        - name: busybox
          image: busybox
          command:
            - "/bin/sleep"
            - "10000"
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "azure-kvname"
    ```
    
    ## Secret Rotation
    
    ### Automatic Rotation with External Secrets
    ```yaml
    apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      name: auto-rotated-secrets
    spec:
      refreshInterval: 5m  # Check every 5 minutes
      secretStoreRef:
        name: azure-kv-store
      target:
        name: auto-rotated-secrets
      data:
        - secretKey: rotated-secret
          remoteRef:
            key: rotating-secret
    ```
    
    ### Manual Secret Rotation in Key Vault
    ```bash
    # Update secret with new value
    az keyvault secret set \
      --vault-name kvsecrets001 \
      --name "database-password" \
      --value "NewSecurePassword456!"
    
    # View secret versions
    az keyvault secret list-versions \
      --vault-name kvsecrets001 \
      --name "database-password"
    ```
    
    ## Best Practices
    
    1. **Use Workload Identity**: Best for AKS with AAD integration
    2. **Rotate secrets regularly**: Automate with Key Vault rotation policies
    3. **Use secret versions**: Reference specific versions in production
    4. **Audit access**: Enable diagnostic logging
    5. **Limit permissions**: Use least privilege RBAC roles
    6. **Set expiration**: Add expiration dates to secrets
    
    ## Monitoring and Auditing
    
    ```bash
    # Enable diagnostic logging
    az monitor diagnostic-settings create \
      --name kv-diagnostics \
      --resource $VAULT_ID \
      --logs '[{"category":"AuditEvent","enabled":true}]' \
      --workspace <workspace-id>
    
    # Query audit logs (requires Log Analytics)
    az monitor log-analytics query \
      --workspace kvsecrets001 \
      --analytics-query "AzureDiagnostics | where ResourceType == 'VAULTS' | take 10"
    ```
    
    ## Cleanup
    ```bash
    kubectl delete namespace azure-keyvault-secrets
    ```
