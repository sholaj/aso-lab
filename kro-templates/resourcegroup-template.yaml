# KRO Template - Resource Group
# This defines a reusable template for creating Azure Resource Groups

apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: resourcegroup-template
spec:
  # Schema definition for template parameters
  schema:
    apiVersion: v1alpha1
    kind: ResourceGroupTemplate
    spec:
      name: string
      location: string | default="northeurope"
      purpose: string | default="general"
      owner: string | default="platform-team"
    status:
      ready: ${resourceGroup.status.conditions}

  # Resources to create
  resources:
    - id: resourceGroup
      template:
        apiVersion: resources.azure.com/v1api20200601
        kind: ResourceGroup
        metadata:
          name: ${schema.spec.name}
        spec:
          location: ${schema.spec.location}
          tags:
            purpose: ${schema.spec.purpose}
            owner: ${schema.spec.owner}
            managed-by: kro
