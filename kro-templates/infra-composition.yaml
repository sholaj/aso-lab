# KRO Template - Full Infrastructure Composition
# This template creates: Resource Group + Key Vault + Storage Account + Log Analytics

apiVersion: kro.run/v1alpha1
kind: ResourceGroup
metadata:
  name: infra-composition-template
spec:
  # Schema definition for template parameters
  schema:
    apiVersion: v1alpha1
    kind: InfraComposition
    spec:
      projectName:
        type: string
        description: "Project name prefix (e.g., 'myapp')"
      location:
        type: string
        description: "Azure region"
        default: "northeurope"
      tenantId:
        type: string
        description: "Azure AD tenant ID"
      owner:
        type: string
        description: "Owner tag value"
        default: "shola"

  # Resources to create (order matters for dependencies)
  resources:
    # 1. Resource Group
    - id: resourceGroup
      template:
        apiVersion: resources.azure.com/v1api20200601
        kind: ResourceGroup
        metadata:
          name: "rg-{{ .spec.projectName }}"
          namespace: default
        spec:
          location: "{{ .spec.location }}"
          tags:
            project: "{{ .spec.projectName }}"
            owner: "{{ .spec.owner }}"
            managed-by: kro

    # 2. Storage Account
    - id: storageAccount
      template:
        apiVersion: storage.azure.com/v1api20230101
        kind: StorageAccount
        metadata:
          name: "st{{ .spec.projectName }}001"
          namespace: default
        spec:
          location: "{{ .spec.location }}"
          owner:
            name: "rg-{{ .spec.projectName }}"
          kind: StorageV2
          sku:
            name: Standard_LRS
          properties:
            accessTier: Hot
            allowBlobPublicAccess: false
            minimumTlsVersion: TLS1_2
            supportsHttpsTrafficOnly: true
          tags:
            project: "{{ .spec.projectName }}"
            owner: "{{ .spec.owner }}"
            managed-by: kro

    # 3. Key Vault
    - id: keyVault
      template:
        apiVersion: keyvault.azure.com/v1api20230701
        kind: Vault
        metadata:
          name: "kv-{{ .spec.projectName }}"
          namespace: default
        spec:
          location: "{{ .spec.location }}"
          owner:
            name: "rg-{{ .spec.projectName }}"
          properties:
            enableRbacAuthorization: true
            enableSoftDelete: true
            softDeleteRetentionInDays: 7
            sku:
              family: A
              name: standard
            tenantId: "{{ .spec.tenantId }}"
            publicNetworkAccess: Enabled
          tags:
            project: "{{ .spec.projectName }}"
            owner: "{{ .spec.owner }}"
            managed-by: kro

    # 4. Log Analytics Workspace
    - id: logAnalytics
      template:
        apiVersion: operationalinsights.azure.com/v1api20221001
        kind: Workspace
        metadata:
          name: "law-{{ .spec.projectName }}"
          namespace: default
        spec:
          location: "{{ .spec.location }}"
          owner:
            name: "rg-{{ .spec.projectName }}"
          properties:
            sku:
              name: PerGB2018
            retentionInDays: 30
          tags:
            project: "{{ .spec.projectName }}"
            owner: "{{ .spec.owner }}"
            managed-by: kro
