# KRO Template - Full Infrastructure Composition
# This template creates: Resource Group + Key Vault + Storage Account + Log Analytics

apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: infra-composition-template
spec:
  # Schema definition for template parameters
  schema:
    apiVersion: v1alpha1
    kind: InfraComposition
    spec:
      projectName: string
      location: string | default="northeurope"
      tenantId: string
      owner: string | default="shola"
    status:
      resourceGroupReady: ${resourceGroup.status.conditions}

  # Resources to create (order matters for dependencies)
  resources:
    # 1. Resource Group
    - id: resourceGroup
      template:
        apiVersion: resources.azure.com/v1api20200601
        kind: ResourceGroup
        metadata:
          name: rg-${schema.spec.projectName}
        spec:
          location: ${schema.spec.location}
          tags:
            project: ${schema.spec.projectName}
            owner: ${schema.spec.owner}
            managed-by: kro

    # 2. Storage Account
    - id: storageAccount
      template:
        apiVersion: storage.azure.com/v1api20230101
        kind: StorageAccount
        metadata:
          name: st${schema.spec.projectName}001
        spec:
          location: ${schema.spec.location}
          owner:
            name: ${resourceGroup.metadata.name}
          kind: StorageV2
          sku:
            name: Standard_LRS
          accessTier: Hot
          allowBlobPublicAccess: false
          minimumTlsVersion: TLS1_2
          supportsHttpsTrafficOnly: true
          encryption:
            keySource: Microsoft.Storage
            services:
              blob:
                enabled: true
              file:
                enabled: true
          tags:
            project: ${schema.spec.projectName}
            owner: ${schema.spec.owner}
            managed-by: kro

    # 3. Key Vault
    - id: keyVault
      template:
        apiVersion: keyvault.azure.com/v1api20230701
        kind: Vault
        metadata:
          name: kv-${schema.spec.projectName}
        spec:
          location: ${schema.spec.location}
          owner:
            name: ${resourceGroup.metadata.name}
          properties:
            enableRbacAuthorization: true
            enableSoftDelete: true
            softDeleteRetentionInDays: 7
            sku:
              family: A
              name: standard
            tenantId: ${schema.spec.tenantId}
            publicNetworkAccess: Enabled
            networkAcls:
              bypass: AzureServices
              defaultAction: Allow
          tags:
            project: ${schema.spec.projectName}
            owner: ${schema.spec.owner}
            managed-by: kro

    # 4. Log Analytics Workspace
    - id: logAnalytics
      template:
        apiVersion: operationalinsights.azure.com/v1api20210601
        kind: Workspace
        metadata:
          name: law-${schema.spec.projectName}
        spec:
          location: ${schema.spec.location}
          owner:
            name: ${resourceGroup.metadata.name}
          sku:
            name: PerGB2018
          retentionInDays: 30
          publicNetworkAccessForIngestion: Enabled
          publicNetworkAccessForQuery: Enabled
          tags:
            project: ${schema.spec.projectName}
            owner: ${schema.spec.owner}
            managed-by: kro
