# KRO Template - AKS Cluster
# This template creates a production-ready AKS cluster with common add-ons

apiVersion: kro.run/v1alpha1
kind: ResourceGroup
metadata:
  name: aks-cluster-template
spec:
  # Schema definition for template parameters
  schema:
    apiVersion: v1alpha1
    kind: AKSClusterTemplate
    spec:
      clusterName:
        type: string
        description: "Name of the AKS cluster"
      location:
        type: string
        description: "Azure region"
        default: "northeurope"
      resourceGroup:
        type: string
        description: "Name of the owner resource group"
      kubernetesVersion:
        type: string
        description: "Kubernetes version"
        default: ""
      nodeCount:
        type: integer
        description: "Number of nodes in default node pool"
        default: 2
      nodeVMSize:
        type: string
        description: "VM size for nodes"
        default: "Standard_D2s_v3"
      enableRBAC:
        type: boolean
        description: "Enable Kubernetes RBAC"
        default: true
      networkPlugin:
        type: string
        description: "Network plugin: azure or kubenet"
        default: "azure"
      networkPluginMode:
        type: string
        description: "Network plugin mode: overlay or blank"
        default: "overlay"
      logAnalyticsWorkspace:
        type: string
        description: "Resource ID of Log Analytics Workspace (optional)"
        default: ""
      tags:
        type: object
        description: "Resource tags"
        default:
          managed-by: kro

  # Resources to create
  resources:
    # AKS Managed Cluster
    - id: aksCluster
      template:
        apiVersion: containerservice.azure.com/v1api20231001
        kind: ManagedCluster
        metadata:
          name: "{{ .spec.clusterName }}"
          namespace: default
        spec:
          location: "{{ .spec.location }}"
          owner:
            name: "{{ .spec.resourceGroup }}"

          # Cluster identity
          identity:
            type: SystemAssigned

          # Kubernetes configuration
          kubernetesVersion: "{{ .spec.kubernetesVersion }}"
          dnsPrefix: "{{ .spec.clusterName }}"

          # Enable RBAC
          enableRBAC: "{{ .spec.enableRBAC }}"

          # Network profile
          networkProfile:
            networkPlugin: "{{ .spec.networkPlugin }}"
            networkPluginMode: "{{ .spec.networkPluginMode }}"
            serviceCidr: 10.0.0.0/16
            dnsServiceIP: 10.0.0.10
            loadBalancerSku: Standard

          # Default agent pool
          agentPoolProfiles:
            - name: systempool
              count: "{{ .spec.nodeCount }}"
              vmSize: "{{ .spec.nodeVMSize }}"
              mode: System
              type: VirtualMachineScaleSets
              osType: Linux
              osDiskSizeGB: 128
              enableAutoScaling: true
              minCount: 1
              maxCount: 5
              maxPods: 110
              orchestratorVersion: "{{ .spec.kubernetesVersion }}"

          # Security profile
          securityProfile:
            defender:
              securityMonitoring:
                enabled: false  # Enable in production

          # Azure AD integration (OIDC issuer)
          oidcIssuerProfile:
            enabled: true

          # Workload identity
          securityProfile:
            workloadIdentity:
              enabled: true

          # Add-ons
          addonProfiles:
            azureKeyvaultSecretsProvider:
              enabled: true
              config:
                enableSecretRotation: "true"
                rotationPollInterval: "2m"
            # Monitoring (if workspace provided)
            omsagent:
              enabled: false  # Set to true if logAnalyticsWorkspace is provided

          # Auto-upgrade channel
          autoUpgradeProfile:
            upgradeChannel: stable

          tags: "{{ .spec.tags }}"
