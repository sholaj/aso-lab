# KRO Template - Key Vault
# This defines a reusable template for creating Azure Key Vaults

apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: keyvault-template
spec:
  # Schema definition for template parameters
  schema:
    apiVersion: v1alpha1
    kind: KeyVaultTemplate
    spec:
      name: string
      location: string | default="northeurope"
      resourceGroup: string
      tenantId: string
      enableRbac: boolean | default=true
      sku: string | default="standard"
      purpose: string | default="secrets"
      owner: string | default="platform-team"
    status:
      vaultReady: ${keyVault.status.conditions}

  # Resources to create
  resources:
    - id: keyVault
      template:
        apiVersion: keyvault.azure.com/v1api20230701
        kind: Vault
        metadata:
          name: ${schema.spec.name}
        spec:
          location: ${schema.spec.location}
          owner:
            name: ${schema.spec.resourceGroup}
          properties:
            enableRbacAuthorization: ${schema.spec.enableRbac}
            enableSoftDelete: true
            softDeleteRetentionInDays: 7
            sku:
              family: A
              name: ${schema.spec.sku}
            tenantId: ${schema.spec.tenantId}
            publicNetworkAccess: Enabled
            networkAcls:
              bypass: AzureServices
              defaultAction: Allow
          tags:
            purpose: ${schema.spec.purpose}
            owner: ${schema.spec.owner}
            managed-by: kro
